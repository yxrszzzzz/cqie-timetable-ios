name: 构建未签名 IPA

# 这个工作流的作用：用 GitHub 免费的 macOS 机器把 iOS 工程编译出来，
# 产出一个「未签名」的 ipa。你在 Windows 上把它下载下来，用爱思助手签名后装到手机。
# 之所以不签名：签名需要你的 Apple 证书，证书不应该放在 GitHub 上。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 用 macos-latest 而不是写死 macos-15：写死的标签被弃用后任务会直接失败
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 看看构建机器的 Xcode 版本
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 从 project.yml 生成 Xcode 工程
        run: xcodegen generate

      # 产物名带上版本号：之前一直叫 CqieTimetable-unsigned，和旧包同名，
      # 下载解压后很容易拿错，装上还以为没更新
      - name: 读出版本号，给产物命名用
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" CqieTimetable/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" CqieTimetable/Info.plist)
          echo "tag=v${VERSION}-${BUILD}" >> "$GITHUB_OUTPUT"
          echo "本次版本：v${VERSION}(${BUILD})"

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project CqieTimetable.xcodeproj \
            -scheme CqieTimetable \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      # 编译失败时把错误捞出来。
      # GitHub 的 job 日志要用 API 下载得有 admin 权限，但 annotations 不用，
      # 所以把 error 行转成 annotation——否则在 Windows 上只能靠人工看网页。
      - name: 编译失败时导出错误
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error::没有拿到 build.log，编译可能还没开始就挂了"
            exit 0
          fi
          echo "=========== 错误行 ==========="
          grep -n "error:" build.log | head -60 || true
          echo "=========== 日志尾部 ==========="
          tail -n 60 build.log
          grep "error:" build.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: 打包成 ipa
        run: |
          IPA_NAME="CqieTimetable-${{ steps.version.outputs.tag }}-unsigned.ipa"
          APP_PATH="build/Build/Products/Release-iphoneos/CqieTimetable.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没找到编译产物 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" -print
            exit 1
          fi
          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          echo "包名：$IPA_NAME"
          echo "包大小："
          ls -lh "$IPA_NAME"
          echo "包内容："
          unzip -l "$IPA_NAME" | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CqieTimetable-${{ steps.version.outputs.tag }}-unsigned-ipa
          path: CqieTimetable-*.ipa
          if-no-files-found: error
          retention-days: 30
